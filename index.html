<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A pocket-sized workspace for CyberChef recipes."
    />
    <title>PocketChef</title>
    <link id="favicon-fallback" rel="icon" href="/favicon.ico?v=line1" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link id="favicon-png" rel="icon" href="/favicon.png?v=line1" type="image/png" sizes="32x32" />
    <link id="favicon" rel="icon" href="/icon-light.svg?v=line1" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=line1" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest?v=line1" />
    <meta name="apple-mobile-web-app-title" content="PocketChef" />
    <script>
      let theme = "system";
      try {
        theme = localStorage.getItem("pocket-chef-theme") || "system";
      } catch {}
      const dark =
        theme === "dark" ||
        (theme !== "light" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      document.getElementById("favicon").href = `/icon-${dark ? "dark" : "light"}.svg?v=line1`;
      document.getElementById("favicon-fallback").href = `/favicon${dark ? "-dark" : ""}.ico?v=line1`;
      document.getElementById("favicon-png").href = `/favicon${dark ? "-dark" : ""}.png?v=line1`;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
