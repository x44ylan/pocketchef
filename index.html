<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A pocket-sized workspace for CyberChef recipes."
    />
    <script>
      try {
        const theme = localStorage.getItem("pocket-chef-theme") || "system";
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <title>PocketChef</title>
    <link rel="icon" href="/favicon.ico?v=4" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.png?v=4" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=4" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest?v=4" />
    <meta name="apple-mobile-web-app-title" content="PocketChef" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
